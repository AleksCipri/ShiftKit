site_name: ShiftKit
site_description: A lightweight, modular domain adaptation framework for PyTorch
site_url: https://AleksCipri.github.io/ShiftKit/
repo_url: https://github.com/AleksCipri/ShiftKit
repo_name: AleksCipri/ShiftKit
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  logo: logo_fox.png
  favicon: logo_fox.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Tutorials & Examples:
      - Overview: tutorials/index.md
      - Source-Only vs MMD vs DANN: tutorials/mnist_mmd.md
      - MMD vs LMMD comparison: tutorials/mmd_vs_lmmd.md
      - Swapping the model: tutorials/swap_model.md
      - Custom dataset: tutorials/custom_dataset.md
      - Tuning λ: tutorials/tuning.md
      - Regression DA: tutorials/regression.md
      - Node-level DA (PyG): tutorials/pyg_node_mmd.md
  - API Reference:
      - Data: data.md
      - Models: models.md
      - Methods:
          - Overview: methods/index.md
          - Source Only: methods/source_only.md
          - MMD: methods/mmd.md
          - DANN: methods/dann.md
          - LMMD: methods/lmmd.md
          - CORAL: methods/coral.md
          - SIDDA: methods/sidda.md
          - KLIEP: methods/kliep.md
          - Custom Methods: methods/custom.md
      - Diagnostics: diagnostics.md
  - Citation: citation.md
  - Credits: credits.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
